<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Min portefølje</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    header { display: flex; justify-content: space-between; align-items: center; }
    header form { display: inline; }
    #search-wrap { position: relative; margin: 1rem 0; }
    #q { width: 100%; padding: .6rem; box-sizing: border-box; }
    #results { position: absolute; left: 0; right: 0; background: Canvas; border: 1px solid #8886; z-index: 5; margin: 0; padding: 0; list-style: none; }
    #results li { padding: .5rem; cursor: pointer; } #results li:hover { background: #8882; }
    #add-form { display: none; gap: .5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
    #add-form input { padding: .4rem; width: 9rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: right; padding: .5rem; border-bottom: 1px solid #8884; }
    th:first-child, td:first-child { text-align: left; }
    .up { color: #0a8f3c; } .down { color: #d1242f; }
    small, .muted { color: #888; }
    button.del { border: 0; background: none; cursor: pointer; color: #d1242f; font-size: 1.1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Min portefølje</h1>
    <span>{{ user.username }}
      {% if user.is_staff %}· <a href="{% url 'admin:index' %}">Admin</a>{% endif %}
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Log ud</button></form>
    </span>
  </header>

  <div id="search-wrap">
    <input id="q" placeholder="Søg aktie (fx Vestas, Novo, Apple)…" autocomplete="off">
    <ul id="results" hidden></ul>
  </div>
  <form id="add-form">
    <strong id="picked"></strong>
    <input id="qty" type="number" step="any" min="0" placeholder="Antal" required>
    <input id="price" type="number" step="any" min="0" placeholder="Købskurs (valgfri)">
    <button>Gem i portefølje</button>
  </form>

  <table>
    <thead><tr><th>Aktie</th><th>Antal</th><th>Kurs</th><th>Dag %</th><th>Værdi</th><th>Gevinst/tab</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p><small id="updated"></small></p>

  <script>
    const csrf = document.cookie.split("; ").find(c => c.startsWith("csrftoken="))?.split("=")[1]
      || "{{ csrf_token }}";
    const $ = id => document.getElementById(id);
    const fmt = (n, d = 2) => n == null ? "–" : n.toLocaleString("da-DK", {minimumFractionDigits: d, maximumFractionDigits: d});

    async function api(url, opts = {}) {
      const res = await fetch(url, {
        ...opts,
        headers: {"Content-Type": "application/json", "X-CSRFToken": csrf},
        credentials: "same-origin",
      });
      if (res.status === 401) { location.href = "{% url 'login' %}?next=/"; return; }
      return res.json();
    }

    function td(text, cls) {
      const el = document.createElement("td");
      el.textContent = text;
      if (cls) el.className = cls;
      return el;
    }

    function render(holdings) {
      const rows = $("rows");
      rows.replaceChildren();
      for (const h of holdings) {
        const q = h.quote || {}, tr = document.createElement("tr");
        const name = td(h.symbol); 
        const sub = document.createElement("div"); sub.className = "muted"; sub.textContent = h.name;
        name.append(sub);
        const dayCls = q.change >= 0 ? "up" : "down", plCls = h.profit >= 0 ? "up" : "down";
        tr.append(
          name,
          td(fmt(h.quantity, 0)),
          td(q.error ? q.error : `${fmt(q.price)} ${q.currency}`),
          td(q.change_percent == null ? "–" : fmt(q.change_percent) + " %", dayCls),
          td(h.value == null ? "–" : `${fmt(h.value)} ${q.currency}`),
          td(h.profit == null ? "–" : `${fmt(h.profit)} (${fmt(h.profit_percent)} %)`, plCls),
        );
        const cell = document.createElement("td"), btn = document.createElement("button");
        btn.className = "del"; btn.title = "Fjern"; btn.textContent = "×";
        btn.onclick = async () => { await api(`/api/holdings/${h.id}/`, {method: "DELETE"}); refresh(); };
        cell.append(btn); tr.append(cell); rows.append(tr);
      }
      $("updated").textContent = "Opdateret " + new Date().toLocaleTimeString("da-DK");
    }

    async function refresh() {
      const data = await api("{% url 'holdings_api' %}");
      if (data) render(data.holdings);
    }

    // Søgning med debounce
    let timer, picked = null;
    $("q").addEventListener("input", () => {
      clearTimeout(timer);
      const q = $("q").value.trim();
      if (q.length < 2) { $("results").hidden = true; return; }
      timer = setTimeout(async () => {
        const data = await api("{% url 'search_api' %}?q=" + encodeURIComponent(q));
        const ul = $("results"); ul.replaceChildren();
        for (const r of data?.results || []) {
          const li = document.createElement("li");
          li.textContent = `${r.symbol} – ${r.name} (${r.exchange})`;
          li.onclick = () => {
            picked = r; ul.hidden = true; $("q").value = "";
            $("picked").textContent = `${r.symbol} – ${r.name}`;
            $("add-form").style.display = "flex"; $("qty").focus();
          };
          ul.append(li);
        }
        ul.hidden = !ul.children.length;
      }, 300);
    });

    $("add-form").addEventListener("submit", async e => {
      e.preventDefault();
      const data = await api("{% url 'holdings_api' %}", {method: "POST", body: JSON.stringify({
        symbol: picked.symbol, name: picked.name, quantity: $("qty").value, purchase_price: $("price").value,
      })});
      if (data?.error) { alert(data.error); return; }
      e.target.reset(); e.target.style.display = "none"; picked = null;
      render(data.holdings);
    });

    refresh(); setInterval(refresh, 15000);
  </script>
</body>
</html>
