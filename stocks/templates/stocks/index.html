{% extends "base.html" %}
{% block title %}Min portefølje{% endblock %}
{% block head %}<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>{% endblock %}

{% block content %}
<h1 class="h3 mb-3">Min portefølje</h1>

<div class="position-relative mb-3">
  <input id="q" class="form-control" placeholder="Søg aktie (fx Vestas, Novo, Apple)…" autocomplete="off">
  <ul id="results" class="list-group shadow" hidden></ul>
</div>
<form id="add-form" class="d-none row g-2 align-items-center mb-4">
  <div class="col-auto fw-semibold" id="picked"></div>
  <div class="col-auto"><input id="qty" class="form-control" type="number" step="any" min="0" placeholder="Antal" required></div>
  <div class="col-auto"><input id="price" class="form-control" type="number" step="any" min="0" placeholder="Købskurs (valgfri)"></div>
  <div class="col-auto"><button class="btn btn-primary">Gem i portefølje</button></div>
</form>

<div class="card mb-4">
  <div class="card-body">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
      <h2 class="h6 mb-0">Udvikling (DKK)</h2>
      <div class="btn-group" id="ranges"></div>
    </div>
    <div class="text-body-secondary small" id="chart-msg"></div>
    <div style="position: relative; height: 320px;"><canvas id="chart"></canvas></div>
  </div>
</div>

<div class="card mb-4">
  <div class="card-body">
    <h2 class="h6">Importér fra Nordnet</h2>
    <div class="row g-2 align-items-center">
      <div class="col-sm"><input type="file" id="csv" class="form-control" accept=".csv,.txt"></div>
      <div class="col-sm-auto"><button id="import-btn" class="btn btn-outline-primary">Importér</button></div>
    </div>
    <div id="import-msg" class="text-body-secondary small mt-2"></div>
  </div>
</div>

<div class="table-responsive">
  <table class="table table-hover align-middle text-end">
    <thead><tr><th class="text-start">Aktie</th><th>Antal</th><th>Kurs</th><th>Dag %</th><th>Værdi</th><th>Gevinst/tab</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<p><small class="text-body-secondary" id="updated"></small></p>
{% endblock %}

{% block scripts %}
<script>
    const csrf = document.cookie.split("; ").find(c => c.startsWith("csrftoken="))?.split("=")[1]
      || "{{ csrf_token }}";
    const $ = id => document.getElementById(id);
    const fmt = (n, d = 2) => n == null ? "–" : n.toLocaleString("da-DK", {minimumFractionDigits: d, maximumFractionDigits: d});

    async function api(url, opts = {}) {
      const res = await fetch(url, {
        ...opts,
        headers: {"Content-Type": "application/json", "X-CSRFToken": csrf},
        credentials: "same-origin",
      });
      if (res.status === 401) { location.href = "{% url 'login' %}?next=/"; return; }
      return res.json();
    }

    function td(text, cls) {
      const el = document.createElement("td");
      el.textContent = text;
      if (cls) el.className = cls;
      return el;
    }

    function render(holdings) {
      const rows = $("rows");
      rows.replaceChildren();
      for (const h of holdings) {
        const q = h.quote || {}, tr = document.createElement("tr");
        const name = td(h.symbol, "text-start");
        const sub = document.createElement("div"); sub.className = "text-body-secondary small"; sub.textContent = h.name;
        name.append(sub);
        const dayCls = q.change >= 0 ? "up" : "down", plCls = h.profit >= 0 ? "up" : "down";
        tr.append(
          name,
          td(fmt(h.quantity, 0)),
          td(q.error ? q.error : `${fmt(q.price)} ${q.currency}`),
          td(q.change_percent == null ? "–" : fmt(q.change_percent) + " %", dayCls),
          td(h.value == null ? "–" : `${fmt(h.value)} ${q.currency}`),
          td(h.profit == null ? "–" : `${fmt(h.profit)} (${fmt(h.profit_percent)} %)`, plCls),
        );
        const cell = document.createElement("td"), btn = document.createElement("button");
        btn.className = "btn btn-sm btn-outline-danger"; btn.title = "Fjern"; btn.textContent = "×";
        btn.onclick = async () => { await api(`/api/holdings/${h.id}/`, {method: "DELETE"}); refresh(); };
        cell.append(btn); tr.append(cell); rows.append(tr);
      }
      $("updated").textContent = "Opdateret " + new Date().toLocaleTimeString("da-DK");
    }

    async function refresh() {
      const data = await api("{% url 'holdings_api' %}");
      if (data) render(data.holdings);
    }

    // Søgning med debounce
    let timer, picked = null;
    $("q").addEventListener("input", () => {
      clearTimeout(timer);
      const q = $("q").value.trim();
      if (q.length < 2) { $("results").hidden = true; return; }
      timer = setTimeout(async () => {
        const data = await api("{% url 'search_api' %}?q=" + encodeURIComponent(q));
        const ul = $("results"); ul.replaceChildren();
        for (const r of data?.results || []) {
          const li = document.createElement("li");
          li.textContent = `${r.symbol} – ${r.name} (${r.exchange})`;
          li.onclick = () => {
            picked = r; ul.hidden = true; $("q").value = "";
            $("picked").textContent = `${r.symbol} – ${r.name}`;
            $("add-form").classList.remove("d-none"); $("qty").focus();
          };
          ul.append(li);
        }
        ul.hidden = !ul.children.length;
      }, 300);
    });

    $("add-form").addEventListener("submit", async e => {
      e.preventDefault();
      const data = await api("{% url 'holdings_api' %}", {method: "POST", body: JSON.stringify({
        symbol: picked.symbol, name: picked.name, quantity: $("qty").value, purchase_price: $("price").value,
      })});
      if (data?.error) { alert(data.error); return; }
      e.target.reset(); e.target.classList.add("d-none"); picked = null;
      render(data.holdings);
    });

    // Graf
    let chart, range = "1y";
    const rangeLabels = {"1m": "1 md", "3m": "3 mdr", "6m": "6 mdr", "1y": "1 år", "max": "Max"};
    for (const [key, label] of Object.entries(rangeLabels)) {
      const b = document.createElement("button");
      b.textContent = label; b.dataset.key = key; b.className = "btn btn-sm btn-outline-secondary";
      b.onclick = () => { range = key; loadChart(); };
      $("ranges").append(b);
    }
    async function loadChart() {
      for (const b of $("ranges").children) b.classList.toggle("active", b.dataset.key === range);
      $("chart-msg").textContent = "Henter…";
      const d = await api("{% url 'history_api' %}?range=" + range);
      if (!d) return;
      $("chart-msg").textContent = d.dates.length ? "" : "Ingen data endnu – importér eller tilføj aktier.";
      const datasets = [{label: "Værdi", data: d.value, borderColor: "#2563eb", pointRadius: 0, tension: .1}];
      if (d.invested.length) datasets.push({label: "Netto indskudt", data: d.invested, borderColor: "#888", borderDash: [5, 5], pointRadius: 0, stepped: true});
      chart?.destroy();
      chart = new Chart($("chart"), {
        type: "line", data: {labels: d.dates, datasets},
        options: {maintainAspectRatio: false, interaction: {mode: "index", intersect: false},
          scales: {y: {ticks: {callback: v => fmt(v, 0)}}, x: {ticks: {maxTicksLimit: 8}}},
          plugins: {tooltip: {callbacks: {label: c => `${c.dataset.label}: ${fmt(c.parsed.y)} kr.`}}}},
      });
    }

    // Import
    $("import-btn").onclick = async () => {
      const file = $("csv").files[0];
      if (!file) { $("import-msg").textContent = "Vælg en CSV-fil først."; return; }
      $("import-msg").textContent = "Importerer… (kan tage et øjeblik)";
      const form = new FormData(); form.append("file", file);
      const res = await fetch("{% url 'import_api' %}", {method: "POST", body: form, headers: {"X-CSRFToken": csrf}, credentials: "same-origin"});
      const d = await res.json();
      if (d.error) { $("import-msg").textContent = d.error; return; }
      let msg = `${d.imported} nye handler importeret, ${d.duplicates} allerede kendt.`;
      if (d.unresolved.length) msg += ` Ticker ikke fundet for: ${d.unresolved.join(", ")} – ret under Admin → Værdipapirer.`;
      $("import-msg").textContent = msg;
      refresh(); loadChart();
    };

    refresh(); loadChart(); setInterval(refresh, 15000);
  </script>
{% endblock %}
