{% extends "base.html" %}
{% block title %}Log ind{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <h1 class="h3 mb-3">Log ind</h1>
    <form method="post" class="card card-body">{% csrf_token %}
      {% if form.errors %}<div class="alert alert-danger">Forkert brugernavn eller adgangskode.</div>{% endif %}
      <div class="mb-3"><label class="form-label" for="id_username">Brugernavn</label>
        <input class="form-control" name="username" id="id_username" autofocus required></div>
      <div class="mb-3"><label class="form-label" for="id_password">Adgangskode</label>
        <input class="form-control" type="password" name="password" id="id_password" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100">Log ind</button>
    </form>
  </div>
</div>
{% endblock %}
